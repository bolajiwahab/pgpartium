---
# yamllint disable rule:line-length
services:
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    container_name: test
    user: root
    tty: true
    command: >
      sh -c "
        pg-start -v ${PGVERSION:-17} &&
        tests/setup.sh -v ${PGVERSION:-17} && \
        pgp-migrate -m tests/migrations -t flyway -v 11.8.0 && \
        pg_prove --username=postgres --dbname=postgres --verbose --failures tests/t/*.sql && \
        bash shellspec tests/spec
        #&&
        #pgp-make-partitions -c /migrations/config.sample.yaml
        # pg-expire-partitions -c /migrations/config.yml
      "
