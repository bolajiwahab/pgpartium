
version: 2
generates:
  - migration-tool: "flyway"
    directory: "/"
    suffix: "YYYY_MM_DD"
    interval: "1 day"
    past: 2
    future: 1
    retention: 24
    create-default: true
    tables:
      users:
        schema: "public"
        partition:
          schema: "partitions"
          tablespace: "tablespace"
          storage_parameters:
            fillfactor: 90
            autovacuum_enabled: false
          past: 2
          future: 1
          retention: 24
          create-default: true
          prefix: "users_"
          suffix: "__YYYY_MM_DD"
          interval: "1 year"
        template:
          schema: "public"
          table: "users_template"
      transactions:
        schema: "partitions"
        suffix: "YYYY_MM_DD"
        interval: "1 month"
        template: "CURRENT_PARTITION"
        past: 2
        future: 1
        retention: 24
        create-default: true
    groups:
      audit-tables:
        patterns:
          - "audit"
          - "users"
