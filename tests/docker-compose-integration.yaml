---
# yamllint disable rule:line-length
# Integration test for an external database: runs pgp-run-lifecycle against a
# dedicated PostgreSQL container, the way an application's own database would
# be reached.
#
# Usage: tests/run-integration-test.sh
services:
  postgres:
    image: postgres:${PG_MAJOR_VERSION:-18}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ../examples/quick-start/initdir:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  pgpartix:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
      args:
        PG_MAJOR_VERSION: ${PG_MAJOR_VERSION:-18}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGP_HOST: postgres
      PGP_PORT: "5432"
      PGP_USER: postgres
      PGP_PASSWORD: postgres
      PGP_DATABASE: postgres
    volumes:
      - ..:/repository
    working_dir: /repository
    command:
      - bash
      - -lc
      - |
        pgp-run-lifecycle -c examples/quick-start/partition-lifecycle.yaml
