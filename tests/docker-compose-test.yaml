---
# yamllint disable rule:line-length
services:
  test:
    build:
      context: ..
      dockerfile: Dockerfile
      target: test
    container_name: test
    user: root
    tty: true
    environment:
      PGP_PG_MAJOR_VERSION: ${PGP_PG_MAJOR_VERSION:-17}
      PGP_INIT_DIR: ${PGP_INIT_DIR:-tests/fixtures/initdir}
    command: >
      sh -c "
        pgp-start && \
        pg_prove --username=postgres --dbname=postgres --verbose --failures tests/tap/**/*.sql && \
        bash shellspec tests/spec --no-warning-as-failure
      "
