---
# yamllint disable rule:line-length
services:
  test:
    build:
      context: ..
      dockerfile: Dockerfile
      target: test
    container_name: test
    user: root
    tty: true
    volumes:
      - ./coverage:/src/coverage
    environment:
      PGP_PG_MAJOR_VERSION: ${PGP_PG_MAJOR_VERSION:-17}
      PGP_INIT_DIR: ${PGP_INIT_DIR:-tests/fixtures/initdir}
      PGP_USER: ${PGP_USER:-postgres}
      PGP_PASSWORD: ${PGP_PASSWORD:-postgres}
      PGP_HOST: ${PGP_HOST:-localhost}
      PGP_PORT: ${PGP_PORT:-5432}
      PGP_DATABASE: ${PGP_DATABASE:-postgres}
      BATS_CORE_VERSION: "v1.13.0"
      PGP_CLUSTER_NAME: pgpartium
      PGUSER: ${PGP_USER:-postgres}
      PGPASSWORD: ${PGP_PASSWORD:-postgres}
      PGHOST: ${PGP_HOST:-localhost}
      PGPORT: ${PGP_PORT:-5432}
      PGDATABASE: ${PGP_DATABASE:-postgres}
      # For testing time-sensitive logic, we expose a config option <mock.now> which could be used
      # to set a fixed timestamp that the mock.now() function will return. This allows us to have consistent
      # and repeatable tests for time-based partitioning logic.
      PGP_CREATE_OPTIONS: --pgoption mock.now=disabled --pgoption search_path=mock,pg_catalog,public
      MIN_COVERAGE: "100"
    command: ["bash", "tests/run-coverage.sh"]
