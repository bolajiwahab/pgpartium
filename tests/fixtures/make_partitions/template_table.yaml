---
generates:
  - directory: "tests"
    name_template: "{table_schema}__{table_name}__YYYY_MM"
    interval: "1 mon"
    tables:
      - table_schema: "public"
        table_name: "transactions"
        file_name_template: "{description}.result"
        description:
          make: "template_table"
        template_table:
          table_schema: "public"
          table_name: "transactions_template"
