---
generates:
  directory: "tests/fixtures/make_partitions"
  name_template: "{table_schema}__{table_name}__YYYY_MM"
  interval: "1 mon"
  default_partition_name_template: "{table_schema}__{table_name}__default"
  create_default: true
  tables:
    - table_schema: "test"
      table_name: "transactions"
      file_name_template: "{description}.result"
      description:
        make: "create_default"
