---
generates:
  directory: "tests/migrations"
  name_template: "{table_schema}__{table_name}__YYYY_MM"
  interval: "1 mon"
  partition_tablespace: "pgpartium"
  tables:
    - table_schema: "public"
      table_name: "transactions"
      file_name_template: "{description}.result"
      description:
        make: "partition_tablespace"
