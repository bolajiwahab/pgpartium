---
lifecycle:
  directory: tests/fixtures/external_db
  timezone: UTC
  description:
    make: "Make partitions for {parent_table_schema}.{parent_table_name} table"
    expire: "Expire partitions for {parent_table_schema}.{parent_table_name} table"
  output:
    file:
      naming:
        template: "V{integer:3}__{description}.sql"
  partition:
    naming:
      template: "{parent_table_schema}__{parent_table_name}__YYYY_MM"
    interval: 1 month
    start_timestamp: NOW
    schema: partitions
    future: 2
    retention:
      interval: 12 months
      detach_first: true
  tables:
    - schema: public
      name: transactions
      idempotent: true
    - schema: public
      name: loan
