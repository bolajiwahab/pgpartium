name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    strategy:
      matrix:
        postgresql:
          - 16
          - 17

    name: 🐘 PostgreSQL ${{ matrix.postgresql }}
    runs-on: ubuntu-latest
    container: ghcr.io/bolajiwahab/pgpartium:0.0.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Start PostgreSQL ${{ matrix.postgresql }}
        run: generate-partitions -v ${{ matrix.postgresql }} -c config.yml
