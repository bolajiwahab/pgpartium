---
# yamllint disable rule:line-length
name: Partition lifecycle (reusable)

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      runs_on:
        description: Runner to run the job on. Defaults to ubuntu-latest.
        required: false
        type: string
        default: ubuntu-latest
      config:
        description: Path to the pgpartix lifecycle configuration file or directory, relative to the checked-out repository.
        required: true
        type: string
      image:
        description: Container image to run pgpartix commands in.
        required: false
        type: string
        default: ghcr.io/bolajiwahab/pgpartix
      image_tag:
        description: Image tag to pin, for example "0.9.0".
        required: true
        type: string
      pg_major_version:
        description: PostgreSQL major version to install, and to start the cluster with in ephemeral mode.
        required: false
        type: string
        default: "17"
      mode:
        description: Set to "external" to skip starting an ephemeral cluster and connect to an external database instead (see db_* inputs).
        required: false
        type: string
        default: ephemeral
      init_dir:
        description: Initialization directory applied to the ephemeral, in-job PostgreSQL cluster. Only used in ephemeral mode.
        required: false
        type: string
        default: ""
      db_host:
        description: External database host. Required only when init_dir is empty.
        required: false
        type: string
      db_port:
        description: External database port. Used only when init_dir is empty.
        required: false
        type: string
        default: "5432"
      db_database:
        description: External database name. Required only when init_dir is empty.
        required: false
        type: string
      db_user:
        description: External database role. Required only when init_dir is empty.
        required: false
        type: string
      app_client_id:
        description: GitHub App Client ID used to mint the installation token.
        required: true
        type: string
      branch:
        description: Automation branch name. The "pgpartix/" prefix is added automatically by pgp-gh-create-pr.
        required: false
        type: string
        default: partition-lifecycle
      title:
        description: Pull request title (and default commit message).
        required: false
        type: string
        default: "chore: partition lifecycle"
      commit_message:
        description: Commit message for generated migrations.
        required: false
        type: string
        default: "chore: partition lifecycle"
    secrets:
      app_private_key:
        description: GitHub App private key (PEM contents, including the BEGIN/END lines).
        required: true
      db_password:
        description: External database password. Required only when not using the ephemeral cluster.
        required: false

permissions:
  contents: read
  packages: read

jobs:
  partition-lifecycle:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30

    # Do not let two runs (e.g. a schedule and a manual dispatch) rewrite the
    # same automation branch concurrently.
    concurrency:
      group: partition-lifecycle-${{ inputs.branch }}
      cancel-in-progress: false

    container:
      image: ${{ inputs.image }}:${{ inputs.image_tag }}
      # The image runs as a non-root user by default. GitHub requires Docker
      # actions to be run by the default Docker user (root) in order to be able to access
      # the GITHUB_WORKSPACE directory which is needed by the workflow.
      # https://docs.github.com/en/actions/reference/workflows-and-actions/dockerfile-support#user
      # https://github.com/actions/checkout/issues/956
      options: --user root

    env:
      PGP_INIT_DIR: ${{ inputs.init_dir }}
      PGP_MODE: ${{ inputs.mode }}
      PGP_PG_MAJOR_VERSION: ${{ inputs.pg_major_version }}
      PGP_HOST: ${{ inputs.db_host }}
      PGP_PORT: ${{ inputs.db_port }}
      PGP_DATABASE: ${{ inputs.db_database }}
      PGP_USER: ${{ inputs.db_user }}
      PGP_PASSWORD: ${{ secrets.db_password }}

    steps:
      - name: Create partition-lifecycle App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          # Omitting owner/repositories scopes the token to the calling repository.
          permission-contents: write
          permission-pull-requests: write

      - name: Get App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Check out repository as the App
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Start PostgreSQL and load the application schema
        id: start
        run: pgp-start

      # A command may publish valid tables and still return 1 for other tables.
      # Preserve that partial progress long enough to open/update the PR.
      - name: Run partition lifecycle
        id: lifecycle
        continue-on-error: true
        run: pgp-run-lifecycle -c "${{ inputs.config }}"

      - name: Create or update partition-lifecycle PR
        if: ${{ always() && steps.start.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pgp-gh-create-pr \
            -b "${{ inputs.branch }}" \
            -t "${{ inputs.title }}" \
            -m "${{ inputs.commit_message }}" \
            -n "${{ steps.app-token.outputs.app-slug }}[bot]" \
            -e "${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      # Keep the run visibly failed when any table failed, even though
      # successful migrations were still proposed in the PR.
      - name: Report generation failure
        if: ${{ always() && steps.lifecycle.outcome == 'failure' }}
        run: |
          echo "One or more partition tables failed generation" >&2
          exit 1
