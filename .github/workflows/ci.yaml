---
# yamllint disable rule:line-length
name: CI

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    name: Run pre-commit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install and run pre-commit
        uses: pre-commit/action@v3.0.1

  test-postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgresql:
          - 13
          - 14
          - 15
          - 16
          - 17
    name: Run tests on PostgreSQL ${{ matrix.postgresql }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run tests
        run: |
          PGP_PG_MAJOR_VERSION=${{ matrix.postgresql }} PGP_INIT_DIR=tests/fixtures/initdb.d ./tests/run_tests.sh

  test-migration-tool:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        migration_tool:
          - flyway
          - go-migrate
          - dbmate
          - goose
    name: Run tests with migration tool ${{ matrix.migration_tool }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run tests
        run: |
          MIGRATION_TOOL=${{ matrix.migration_tool }} ./tests/run_tests.sh

  ensure-up-to-date-schema-doc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Ensure schema doc is up to date
        run: tools/ensure_up_to_date_schema_doc.sh
