  test-postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgresql:
          - 13
          - 14
          - 15
          - 16
          - 17
    name: Run tests on PostgreSQL ${{ matrix.postgresql }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          PGVERSION=${{ matrix.postgresql }} ./run_tests.sh

  test-migration-tool:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        migration_tool:
          - flyway
          - go-migrate
          - dbmate
          - goose
    name: Run tests with migration tool ${{ matrix.migration_tool }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          MIGRATION_TOOL=${{ matrix.migration_tool }} ./run_tests.sh
