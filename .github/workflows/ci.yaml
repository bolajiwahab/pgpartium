---
# yamllint disable rule:line-length
name: CI

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 0 * * *"  # Run daily at midnight UTC

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    name: Run pre-commit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install and run pre-commit
        uses: pre-commit/action@v3.0.1

  test-postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgresql:
          - 14
          - 15
          - 16
          - 17
          - 18
          - 19
    name: Run tests on PostgreSQL ${{ matrix.postgresql }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run tests
        run: |
          PGP_PG_MAJOR_VERSION=${{ matrix.postgresql }} tests/run-tests.sh

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run integration test
        run: tests/run-integration-test.sh

  ensure-up-to-date-schema-doc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Ensure schema doc is up to date
        run: tools/ensure_up_to_date_schema_doc.sh
