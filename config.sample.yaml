---
# Values under lifecycle are defaults for every table. A table may override
# description, output_file_template, and any partition option.
lifecycle:
  # This directory must already exist. Generated migrations are written here.
  directory: migrations/partitions

  # Used consistently when calculating partition bounds and retention.
  timezone: Etc/UTC

  # {table_schema} and {table_name} are resolved before {description} is used
  # by output_file_template.
  description:
    make: "Make partitions for {table_schema}_{table_name}"
    expire: "Expire partitions for {table_schema}_{table_name}"

  # Supported placeholders include {integer}, {integer:N}, {description},
  # {timestamp}, {epoch}, {date}, {year}, {month}, {day}, {hour}, and
  # {direction}. The direction is currently "up".
  output_file_template: "V{integer:3}__{description}.sql"

  partition:
    # Partition names support {table_schema}, {table_name}, and PostgreSQL
    # to_char patterns such as YYYY, MM, DD, HH24, MI, SS, IYYY, and IW.
    naming:
      template: "{table_schema}__{table_name}__YYYY_MM"

    # Defaults to the parent table's schema when omitted. The schema and
    # tablespaces must already exist.
    schema: partitions
    tablespace: pg_default

    # Used by pgp-make-partitions. Any positive PostgreSQL interval is valid.
    interval: 1 month
    start_timestamp: NOW
    past: 0
    future: 2

    # Create a default partition when the parent does not already have one.
    default:
      naming:
        template: "{table_schema}__{table_name}__default"

    # Prevent generation of partitions older than this interval and generate
    # expiration DDL for partitions whose upper bound is at least this old.
    retention: 12 months

    skip_overlapping: false
    idempotent: true

    # Storage modes:
    #   override - use only these parameters (the default)
    #   inherit  - use parameters from the selected template table
    #   merge    - inherit from the template, then apply these overrides
    storage:
      mode: override
      parameters:
        fillfactor: 90
        autovacuum_enabled: true

    index:
      naming:
        template: "{partition_name}_{index_keys}_{index_type}_idx{ordinal}"
      tablespace: pg_default

    # The generic constraint template is the fallback. Type-specific templates
    # override it. {constraint_suffix} resolves to pkey, key, fkey, check, or
    # excl. {ordinal} is empty for the first matching object.
    constraint:
      naming:
        template: "{partition_name}_{constraint_keys}_{constraint_suffix}{ordinal}"
        primary_key:
          template: "{partition_name}_pkey"
        unique_key:
          template: "{partition_name}_{constraint_keys}_key{ordinal}"
        foreign_key:
          template: "{partition_name}_{constraint_keys}_fkey{ordinal}"
        check:
          template: "{partition_name}_{constraint_keys}_check{ordinal}"
        exclusion:
          template: "{partition_name}_{constraint_keys}_excl{ordinal}"

    # Expiration mode. With detach_first enabled, generated SQL detaches and
    # then drops each expired partition. detach_only takes precedence.
    detach_first: true
    detach_only: false
    detach_concurrently: true

  tables:
    - schema: public
      name: transactions

      # Objects present on this table but absent from the partitioned parent
      # are replicated onto new partitions. This can also be
      # CURRENT_PARTITION, LATEST_PARTITION, or DEFAULT_PARTITION.
      template:
        schema: public
        name: transactions_template

    - schema: public
      name: audit_events

      # Table-level values override lifecycle defaults.
      description:
        make: "Make weekly partitions for {table_schema}_{table_name}"
        expire: "Expire weekly partitions for {table_schema}_{table_name}"
      partition:
        naming:
          template: "{table_schema}__{table_name}__IYYY_IW"
        interval: 1 week
        future: 4
        retention: 26 weeks
        detach_only: true
        detach_first: false
        detach_concurrently: false
